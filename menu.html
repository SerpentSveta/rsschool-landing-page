<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <title>Coffee House Menu</title>
</head>

<body>
  <div class="wrapper">
    <header class="header">
      <a href="./index.html" class="logo"><img src="./src/assets/logo.png" alt="Logo Coffee House"></a>
      <nav class="header__navigation">
        <ul class="navigation">
          <li class="navigation__item"><a href="../index.html#favorite-coffee" class="navigation__link">Favorite
              coffee</a></li>
          <li class="navigation__item"><a href="../index.html#about" class="navigation__link">About</a></li>
          <li class="navigation__item"><a href="../index.html#mobile-app" class="navigation__link">Mobile app</a></li>
          <li class="navigation__item"><a href="../index.html#contact-us" class="navigation__link">Contact us</a></li>
        </ul>
      </nav>
      <div class="header__actions">
        <button class="theme-switch" type="button" aria-label="Toggle theme">
          <span class="theme-switch__item theme-switch__item_sun">
            <span class="theme-switch__icon"></span>
          </span>
          <span class="theme-switch__item theme-switch__item_moon">
            <span class="theme-switch__icon"></span>
          </span>
        </button>
        <button class="menu menu--active" type="button" aria-label="Open menu">Menu</button>
      </div>

    </header>
    <main>
      <h1 class="visually-hidden">Coffee House Menu</h1>
      <section class="coffee">
        <h2 class="coffee__title">Behind each of our cups hides an <span class="title__accent">amazing surprise</span>
        </h2>
        <div class="coffee__button-wrapper">
          <button class="product-switch product-switch--active" type="button" aria-label="Coffee">
            <span class="product-switch__item product-switch__item--coffee">
              <span class="product-switch__icon"></span>
            </span>
            <span class="product-switch__text">Coffee</span>
          </button>
          <button class="product-switch" type="button" aria-label="Tea">
            <span class="product-switch__item product-switch__item--tea">
              <span class="product-switch__icon"></span>
            </span>
            <span class="product-switch__text">Tea</span>
          </button>
          <button class="product-switch" type="button" aria-label="Dessert">
            <span class="product-switch__item product-switch__item--dessert">
              <span class="product-switch__icon"></span>
            </span>
            <span class="product-switch__text">Dessert</span>
          </button>
        </div>
        <div class="cards__wrapper"></div>
      </section>
    </main>
    <footer id="contact-us">
      <div class="footer__container">
        <div class="footer__info">
          <h2 class="footer__title">Sip, Savor, Smile.
            <span class="title__accent">It’s coffee time!</span>
          </h2>
          <ul class="social-icons">
            <li class="social-icons__item"><a class="social-icons__link social-icons__link--twitter"
                href="https://www.twitter.com/" target="_blank" aria-label="Coffee House в Twitter">
              </a></li>
            <li class="social-icons__item"><a class="social-icons__link social-icons__link--instagram"
                href="https://www.instagram.com/" target="_blank" aria-label="Coffee House в Instagram">
              </a></li>
            <li class="social-icons__item"><a class="social-icons__link social-icons__link--facebook"
                href="https://www.facebook.com/" target="_blank" aria-label="Coffee House в Facebook">
              </a></li>
          </ul>
        </div>
        <div class="contacts">
          <div class="contacts__title">Contact us</div>
          <ul class="contacts__items">
            <li><a href="https://maps.app.goo.gl/fh5ErmNzkoShyMUP8" target="_blank" class="contacts__item"><span
                  class="contact__icon contact__icon_pin"></span><span class="contact__text">8558 Green Rd.,
                  LA</span></a></li>
            <li><a href="tel:+16035550123" class="contacts__item"><span
                  class="contact__icon contact__icon_tel"></span><span
                  class="contact__text">+1&nbsp;(603)&nbsp;555&#8209;0123</span></a></li>
            <li class="contacts__item"><span class="contact__icon contact__icon_time"></span><span
                class="contact__text">Mon–Sat: 9:00–23:00</span></li>
          </ul>
        </div>
      </div>
    </footer>
  </div>
  <script type="module" src="/src/js/main.js"></script>
  <script type="module" src="/src/js/menu.js"></script>
</body>

</html>
